<!DOCTYPE html>
<html lang="en" data-theme="freevy">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
<title>Fill in</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
</svg>
<div class="prompt">
  <div class="prompt-bar" id="bar">
    <span class="brand-mark"><svg class="brand-glyph" viewBox="24 21 53 58" aria-hidden="true"><rect x="24" y="21" width="12" height="58" rx="6"/><rect x="43" y="21" width="33" height="12" rx="6"/><rect x="43" y="44" width="19" height="12" rx="6"/><circle cx="71" cy="50" r="5.5"/></svg></span>
    <strong>Fill in</strong>
    <button class="window-button window-button--close" id="cancel-x" aria-label="Cancel"><svg class="icon"><use href="#i-x"/></svg></button>
  </div>
  <form class="prompt-body" id="form">
    <div id="fields"></div>
    <div class="dialog-actions"><button type="button" class="btn btn--ghost" id="cancel">Cancel</button><button type="submit" class="btn btn--primary" id="submit">Type it</button></div>
  </form>
</div>
<script src="js/fill.js"></script>
</body>
</html>
