<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New message</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; background: #eef1f5; color: #1e2330; }
  .window { margin: 18px; background: #fff; border-radius: 12px; box-shadow: 0 0 0 0.5px rgb(15 23 42 / 0.12), 0 8px 30px rgb(15 23 42 / 0.10); overflow: hidden; }
  .bar { padding: 12px 18px; font-weight: 600; background: #1e2330; color: #fff; font-size: 14px; }
  .row { display: flex; gap: 12px; padding: 10px 18px; border-bottom: 1px solid #e6e9ef; }
  .row span { width: 64px; color: #6b7280; }
  textarea { display: block; width: 100%; height: 330px; border: 0; padding: 16px 18px; font: inherit; resize: none; outline: none; color: #1e2330; }
  .foot { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-top: 1px solid #e6e9ef; }
  .send { background: #0d9488; color: #fff; border: 0; border-radius: 8px; padding: 8px 18px; font: inherit; font-weight: 600; }
  .hint { color: #6b7280; font-size: 13px; }
</style>
</head>
<body>
  <div class="window">
    <div class="bar">New message</div>
    <div class="row"><span>To</span>sam@example.com</div>
    <div class="row"><span>Subject</span>Quarterly report</div>
    <textarea id="body" spellcheck="false" autofocus></textarea>
    <div class="foot"><span class="hint">Typed with Freevy</span><button class="send" type="button">Send</button></div>
  </div>
</body>
</html>
